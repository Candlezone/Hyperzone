  body::after{
  content: " ";
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  background: linear-gradient(rgba(255, 213, 237, 0.3) 80%, rgba(221, 254, 255, 0.3) 80%);

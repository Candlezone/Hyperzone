  background-size: 100% 2px, 3px 100%;
  pointer-events: none;
  }
  body::before{
  content: " ";
  display: block;
  position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  z-index: 1010;
  pointer-events: none;
  background-image: url('https://media.tenor.com/v5w0Fak7A18AAAAM/kirby.gif');
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  animation: KirbyHi 2s ease 0s 1 normal forwards;
}
@keyframes KirbyHi { 
  0%, 75% { opacity: 1; } 
  100% { opacity: 0; } </style>
